# Templat kredensial FTP untuk deploy/sinkron.sh.
#
# Salin berkas ini menjadi deploy/ftp.ini lalu isi nilainya. deploy/ftp.ini
# masuk .gitignore dan tidak boleh pernah ikut ter-commit — statusnya sama
# dengan .env.
#
# Nilai dibaca baris per baris (bukan dieksekusi sebagai shell), jadi spasi
# di sekitar tanda = ikut terbaca sebagai bagian nilai. Hindari tanda kutip
# dan tanda persen pada SANDI.

# Kontrol Panel InfinityFree → FTP Account. Bukan domain situs Anda.
HOST=ftpupload.net

# Nama akun FTP (biasanya sama dengan nama akun hosting).
PENGGUNA=

# Kata sandi FTP, diatur sendiri dari Kontrol Panel.
SANDI=

# Folder tujuan di server. Dokumen root hosting ini selalu htdocs.
REMOTE=/htdocs

# Port FTP. InfinityFree memakai 21 dengan Explicit TLS.
PORT=21

# Berapa berkas dikirim bersamaan. Koneksi FTP membuka sesi baru tiap berkas,
# jadi angka besar mempercepat unggahan perdana tetapi mudah kena batas akun.
PARALEL=4
